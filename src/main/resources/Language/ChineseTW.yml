    Failed: '&6儲存或還原領地藍圖失敗！'
CommandHelp:
  Description: 內涵領地說明
  SubCommands:
    res:
      Description: 領地的主要指令
      Info:
      - '&2使用 &6/res [指令] ? <頁數> &2查看更多資訊。'
      SubCommands:
        auto:
          Info:
          - '&e用法：&6/res auto （領地名稱） （半徑）'
          Description: 在你周圍建立最大允許範圍的領地
        select:
          Info:
          - '&e這個指令用於選擇領地的範圍'
          - '&6/res select [x] [y] [z] &e- 選擇以你為中心一定範圍的方塊'
          Description: 選擇工具指令
          SubCommands:
            coords:
              Description: 顯示已選擇區域的座標
              Info:
              - '&e用法：&6/res select coords'
            size:
              Description: 顯示已選擇區域的大小
              Info:
              - '&e用法：&6/res select size'
            auto:
              Description: 開啟自動選擇工具
              Info:
              - '&e用法：&6/res select auto [玩家名稱]'
            cost:
              Description: 顯示已選擇區域的價格
              Info:
              - '&e用法：&6/res select cost'
            vert:
              Description: 垂直擴展選擇區域
              Info:
              - '&e用法：&6/res select vert'
              - '&e將選擇區域擴展頂部和底部'
            sky:
              Description: 擴展選擇區域到天空
              Info:
              - '&e用法：&6/res select sky'
              - '&e將選擇區域擴展到頂部'
            bedrock:
              Description: 擴展選擇區域到基岩
              Info:
              - '&e用法：&6/res select bedrock'
              - '&e將選擇區域擴展到底部'
            expand:
              Description: 向面對的方向擴展選擇區域
              Info:
              - '&e用法：&6/res select expand <數量>'
              - '&e向面對的方向擴展 &6<數量> &e格方塊'
            shift:
              Description: 向面對的方向平移選擇區域
              Info:
              - '&e用法：&6/res select shift <數量>'
              - '&e向面對的方向平移 &6<數量> &e格方塊'
            chunk:
              Description: 選擇你目前所在的區塊
              Info:
              - '&e用法：&6/res select chunk'
              - '&e選擇你目前所在的區塊'
            residence:
              Description: 選擇領地中存在的區域
              Info:
              - '&e用法：&6/res select residence <領地名稱>'
              - '&e選擇領地中存在的區域'
            worldedit:
              Description: 使用 WorldEdit 選擇區域
              Info:
              - '&e用法：&6/res select worldedit'
              - '&e使用 WorldEdit 選擇區域'
            move:
              Description: 開啟移動擴展選區工具
              Info:
              - '&e用法：&6/res select move [玩家名稱]'
            considerlimits:
              Description: 切換選區時是否套用群組上限
              Info:
              - '&e用法：&6/res select considerlimits [玩家名稱]'
            togglecombo:
              Description: 切換組合選區模式
              Info:
              - '&e用法：&6/res select togglecombo [玩家名稱]'
            options:
              Description: 開啟選區選項介面
              Info:
              - '&e用法：&6/res select options [玩家名稱]'
            outward:
              Description: 將選區向外擴展指定格數
              Info:
              - '&e用法：&6/res select outward [玩家名稱]'
            aim:
              Description: 開啟準星指向選區工具
              Info:
              - '&e用法：&6/res select aim [玩家名稱]'
            clear:
              Description: 清除目前選區
              Info:
              - '&e用法：&6/res select clear [玩家名稱]'
            quickbar:
              Description: 開啟快捷列選區工具
              Info:
              - '&e用法：&6/res select quickbar [玩家名稱]'
        padd:
          Info:
          - '&e用法：&6/res padd <領地名稱> [玩家名稱]'
          - '&e新增玩家的基本權限'
          Description: 新增玩家到領地
        placeholders:
          Info:
          - '&e用法：&6/res placeholders （parse） （placeholder） （玩家名稱）'
          Description: 列出 placeholder 列表
          parse: '[result]'
        signconvert:
          Info:
          - '&e用法：&6/res signconvert'
          - '&e嘗試從第三方插件轉換儲存告示牌資料'
          Description: 轉換 ResidenceSign 插件的告示牌
        listallhidden:
          Info:
          - '&e用法：&6/res listhidden <頁數>'
          - '&e顯示伺服器所有隱藏的領地'
          Description: 顯示所有隱藏的領地
        bank:
          Info:
          - '&e用法：&6/res bank [deposit/withdraw] <領地名稱> [金額]'
          - '&e你必須站在領地中或指定領地名稱且'
          - '&e擁有銀行（bank）權限'
          Description: 管理領地銀行
        create:
          Info:
          - '&e用法：&6/res create [領地名稱]'
          Description: 建立領地
        listall:
          Info:
          - '&e用法：&6/res listall <頁數> <世界名稱> <-a/-f>'
          - '&e列出所有的領地'
          Description: 列出所有的領地
        info:
          Info:
          - '&e用法：&6/res info <領地名稱>'
          - '&e留空 <領地名稱> 以顯示你目前所在的領地資訊'
          Description: 顯示領地的資訊
        area:
          Description: 管理領地區域
          Info:
          - ''
          SubCommands:
            list:
              Description: 列出領地區域
              Info:
              - '&e用法：&6/res area list [領地名稱] <頁數>'
            listall:
              Description: 列出所有區域的座標和詳細資訊
              Info:
              - '&e用法：&6/res area listall [領地名稱] <頁數>'
            add:
              Description: 為領地新增區域
              Info:
              - '&e用法：&6/res area add [領地名稱] [區域 ID]'
              - '&e必須先選中兩個選擇點'
            remove:
              Description: 移除領地區域
              Info:
              - '&e用法：&6/res area remove [領地名稱] [區域 ID]'
            replace:
              Description: 替換領地區域
              Info:
              - '&e用法：&6/res area replace [領地名稱] [區域 ID]'
              - '&e必須先選中兩個選擇點'
              - '&e如果新的區域更大，二者之間將會被填充'
        give:
          Info:
          - '&e用法：&6/res give <領地名稱> [玩家名稱] <-s>'
          - '&e將你的領地轉移給目標玩家'
          Description: 給予其他玩家領地
        renamearea:
          Info:
          - '&e用法：&6/res removeworld [領地名稱] [舊區域名稱] [新區域名稱]'
          Description: 重新命名區域
        contract:
          Info:
          - '&e用法：&6/res contract （領地名稱） [縮小單位]'
          - '&e向你面對的方向縮小領地，'
          - '&e領地名稱是可選命名的'
          Description: 向你面對的方向縮小領地
        check:
          Info:
          - '&e用法：&6/res check [領地名稱] [權限] （玩家名稱）'
          Description: 為你檢查權限狀態
        gset:
          Info:
          - '&e用法：&6/res gset <領地名稱> [群組] [權限] [true/false/remove]'
          - '&e使用 &6/res flags ? &e查看權限列表'
          Description: 為某個組設定領地的特定權限
        list:
          Info:
          - '&e用法：&6/res list <玩家名稱> <頁數> <世界名稱>'
          - '&e列出指定玩家擁有的所有領地（除了隱藏領地）'
          - '&e如果顯示自己的領地，隱藏領地也會被顯示'
          - '&e如果要列出所有玩家的領地，請使用指令 &6/res listall'
          Description: 顯示領地列表
        version:
          Info:
          - '&e用法：&6/res version'
          Description: 顯示領地插件版本
        tool:
          Info:
          - '&e用法：&6/res tool'
          Description: 顯示領地選擇工具和領地資訊工具名稱
        pdel:
          Info:
          - '&e用法：&6/res pdel <領地名稱> [玩家名稱]'
          - '&e移除玩家的基本權限'
          Description: 從領地移除玩家
        market:
          Info:
          - '&e用法：&6/res market ? &e查看更多資訊'
          Description: 購買、出售、租用領地
          SubCommands:
            Info:
              Description: 查看領地的經濟資訊
              Info:
              - '&e用法：&6/res market Info [領地名稱]'
              - '&e顯示領地是否正在出租、出售以及領地的花費'
            list:
              Description: 顯示可出租與可出售的領地
              Info:
              - '&e用法：&6/res market list [rent/sell]'
              SubCommands:
                rent:
                  Description: 列出可以被出租的領地
                  Info:
                  - '&e用法：&6/res market list rent'
                sell:
                  Description: 列出可以被出售的領地
                  Info:
                  - '&e用法：&6/res market list sell'
            sell:
              Description: 出售領地
              Info:
              - '&e用法：&6/res market sell [領地名稱] [金額]'
              - '&e將領地以 &6[金額] &e的價格出售'
              - '&e其他玩家可以使用 &6/res market buy 購買'
            sign:
              Description: 設定市場告示牌
              Info:
              - '&e用法：&6/res market sign [領地名稱]'
              - '&e將看向的告示牌設定為領地市場告示牌'
            buy:
              Description: 購買領地
              Info:
              - '&e用法：&6/res market buy [領地名稱]'
              - '&e如果這個領地正在出售，則購買這個領地'
            unsell:
              Description: 取消出售領地
              Info:
              - '&e用法：&6/res market unsell [領地名稱]'
            rent:
              Description: 租用領地
              Info:
              - '&e用法：&6/res market rent [領地名稱] <自動續租付款>'
              - '&e租用領地。自動續租可設定為 true 或 false，如果是 true 並且獲得領地擁有者允許，領地將會在租約到期之前自動續租'
            rentable:
              Description: 出租領地
              Info:
              - '&e用法：&6/res market rentable [領地名稱] [花費] [天數] <AllowRenewing> <StayInMarket>
                <AllowAutoPay>'
              - '&e使領地出租以 [天數] 來計算 [花費]'
              - '&e如果開啟 <AllowRenewing>，則在租約到期前可再次出租'
              - '&e如果開啟 <StayInMarket>，則在租約到期後留在市場上'
              - '&e如果開啟 <AllowAutoPay>，則出租到期時直接自動續租付款'
            autopay:
              Description: 設定領地自動續租付款
              Info:
              - '&e用法：&6/res market autopay [領地名稱] [true/false]'
            payrent:
              Description: 支付定額領地的租金
              Info:
              - '&e用法：&6/res market payrent [領地名稱]'
            confirm:
              Description: 確認領地 unrent/release 行動
              Info:
              - '&e用法：&6/res market confirm'
            unrent:
              Description: 取消領地租用或出租狀態
              Info:
              - '&e用法：&6/res market unrent [領地名稱]'
              - '&e如果你是租用者，這個指令將會退租領地'
              - '&e如果你是擁有者，這個指令將會收回領地'
            gui:
              Description: 開啟領地市場互動介面
              Info:
              - '&e用法：&6/res market gui [all/sell/rent/myrent]'
        rc:
          Info:
          - '&e用法：&6/res rc （領地名稱）'
          - '&e加入領地聊天頻道'
          Description: 加入目前或指定的領地聊天頻道
          SubCommands:
            leave:
              Description: 離開目前的領地聊天頻道
              Info:
              - '&e用法：&6/res rc leave'
              - '&e如果你在領地聊天頻道內，那你將離開領地聊天頻道'
            setcolor:
              Description: 設定領地聊天頻道文字顏色
              Info:
              - '&e用法：&6/res rc setcolor [顏色代碼]'
              - '&e設定領地聊天頻道文字顏色'
            setprefix:
              Description: 設定領地聊天頻道前綴
              Info:
              - '&e用法：&6/res rc setprefix [新前綴]'
              - '&e設定領地聊天頻道前綴'
            kick:
              Description: 從領地聊天頻道中踢出玩家
              Info:
              - '&e用法：&6/res rc kick [玩家名稱]'
              - '&e從領地聊天頻道中踢出玩家'
        expand:
          Info:
          - '&e用法：&6/res expand （領地名稱） [擴展單位]'
          - '&e向你面對的方向擴展領地規模，'
          - '&e領地名稱是可選命名的'
          Description: 向你面對的方向擴展領地
        compass:
          Info:
          - '&e用法：&6/res compass <領地名稱>'
          Description: 設定指向領地的羅盤
        lists:
          Info:
          - '&e預先定義的權限列表可以被應用到領地上'
          Description: 預先指定權限列表
          SubCommands:
            add:
              Description: 新增列表
              Info:
              - '&e用法：&6/res lists add <列表名稱>'
            remove:
              Description: 移除列表
              Info:
              - '&e用法：&6/res lists remove <列表名稱>'
            apply:
              Description: 應用領地列表
              Info:
              - '&e用法：&6/res lists apply <列表名稱> <領地名稱>'
            set:
              Description: 設定權限
              Info:
              - '&e用法：&6/res lists set <列表名稱> <權限> [值]'
            pset:
              Description: 設定玩家權限
              Info:
              - '&e用法：&6/res lists pset <列表名稱> <玩家名稱> <權限> [值]'
            gset:
              Description: 設定組權限
              Info:
              - '&e用法：&6/res lists gset <列表名稱> <玩家名稱> <權限> [值]'
            view:
              Description: 查看列表
              Info:
              - '&e用法：&6/res lists view <列表名稱>'
        reset:
          Info:
          - '&e用法：&6/res reset <領地名稱/all>'
          - '&e將領地的所有權限重置'
          Description: 將領地設定還原為預設值
        listhidden:
          Info:
          - '&e用法：&6/res listhidden <玩家名稱> <頁數>'
          - '&e列出玩家擁有的隱藏領地'
          Description: 列出隱藏領地
        raid:
          Info:
          - '&e用法：&6/res raid start [領地名稱] （玩家名稱）'
          - '&6/res raid stop [領地名稱]'
          - '&6/res raid kick [玩家名稱]'
          - '&6/res raid immunity [add/take/set/clear] [領地名稱/目前所在領地] [時間]'
          Description: 管理領地侵略
        setmain:
          Info:
          - '&e用法：&6/res setmain （領地名稱）'
          - '&e將指定的領地設為 main'
          Description: 將定義的領地名稱作為前綴顯示在聊天中
        server:
          Info:
          - '&e用法：&6/resadmin server [領地名稱]'
          - '&e建立伺服器的領地'
          Description: 建立伺服器領地
        rt:
          Info:
          - '&e用法：&6/res rt （世界名稱） （玩家名稱）'
          - '&e傳送到指定世界的隨機位置'
          Description: 傳送到世界的隨機位置
        mirror:
          Info:
          - '&e用法：&6/res mirror [原領地名稱] [目標領地名稱]'
          - '&e將權限從這個領地鏡像到另一個領地，你必須是兩者的所有者或管理員才能執行這個操作'
          Description: 鏡像權限
        shop:
          Info:
          - '&e管理領地的商店功能'
          Description: 管理領地商店
          SubCommands:
            list:
              Description: 顯示領地商店列表
              Info:
              - '&e用法：&6/res shop list'
              - '&e顯示所有作為商店的領地'
            vote:
              Description: 為領地商店投票
              Info:
              - '&e用法：&6/res shop vote <領地名稱> [票數]'
              - '&e為目前或指定領地商店投票'
            like:
              Description: 為領地商店按讚
              Info:
              - '&e用法：&6/res shop like <領地名稱>'
              - '&e為領地商店按讚'
            votes:
              Description: 顯示領地商店投票
              Info:
              - '&e用法：&6/res shop votes <領地名稱> <頁數>'
              - '&e顯示目前或指定領地商店的投票列表'
            likes:
              Description: 顯示領地商店的按讚
              Info:
              - '&e用法：&6/res shop likes <領地名稱> <頁數>'
              - '&e顯示目前或指定的領地商店按讚列表'
            setdesc:
              Description: 設定領地商店描述
              Info:
              - '&e用法：&6/res shop setdesc [文字]'
              - '&e設定領地商店描述，並且支援顏色代碼，用 /n 表示換行'
            createboard:
