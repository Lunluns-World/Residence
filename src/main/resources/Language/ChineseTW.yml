          - '&e把你站的位置設定為領地的傳送點，'
          - '&e前提是你一定要在領地內，'
          - '&e且你還一定要是領地擁有者或者擁有管理員權限'
          Description: 設定傳送點
        tpconfirm:
          Info:
          - '&e用法：&6/res tpconfirm'
          - '&e即使傳送點不安全，仍然強制傳送到領地'
          Description: 忽略不安全傳送警告
        removeall:
          Info:
          - '&e用法：&6/res removeall [擁有者]'
          - '&e移除自己的所有領地'
          - '&e如果你對除你自己以外的任何人使用它，則需要 /resadmin'
          Description: 移除指定玩家的所有領地
        material:
          Info:
          - '&e用法：&6/res material [物品 ID]'
          Description: 檢查物品是否存在其 ID
        kick:
          Info:
          - '&e用法：&6/res kick &6<玩家名稱>'
          - '&e你必須是領地擁有者'
          - '&e且玩家必須在線上'
          Description: 踢出指定玩家
        sublist:
          Info:
          - '&e用法：&6/res sublist <領地名稱> <頁數>'
          - '&e列出所有子區域'
          Description: 列出所有子區域
        rename:
          Info:
          - '&e用法：&6/res rename [舊領地名稱] [新領地名稱]'
          - '&e你必須是擁有者或管理員才能進行這項操作，'
          - '&e新名稱不能與現有領地名稱重複'
          Description: 重新命名領地
        setallfor:
          Info:
          - '&e用法：&6/res setallfor [玩家名稱] [權限] [true/false/remove]'
          Description: 在指定玩家的所有領地上設定通用權限
        lease:
          Info:
          - '&e用法：&6/res lease [renew/cost] [領地名稱]'
          - '&6/res lease cost &e顯示續租領地的花費'
          - '&6/res lease renew &e將會續租指定的領地'
          Description: 管理領地租約
          SubCommands:
            set:
              Description: 設定租約時間
              Info:
              - '&e用法：&6/resadmin lease set [領地名稱] [#days/infinite]'
              - '&e將租約時間設定為特定天數或無限制'
            renew:
              Description: 續租租約時間
              Info:
              - '&e用法：&6/resadmin lease renew <領地名稱>'
              - '&e續租目前或指定的領地租約'
            list:
              Description: 顯示目前住所的租約列表
              Info:
              - '&e用法：&6/resadmin lease list <領地名稱> <頁數>'
              - '&e顯示目前所有子區域的租約時間'
            expires:
              Description: 租約到期時間
              Info:
              - '&e用法：&6/resadmin lease expires <領地名稱>'
              - '&e顯示領地租約到期的時間'
            cost:
              Description: 顯示續租花費
              Info:
              - '&e用法：&6/resadmin lease cost <領地名稱>'
              - '&e顯示續租領地所需的花費'
        tp:
          Info:
          - '&e用法：&6/res tp [領地名稱]'
          - '&e傳送到你指定的領地，你必須擁有傳送（tp）權限或是擁有者才能執行這個操作'
          - '&e伺服器管理員需要給予你設定的權限'
          Description: 傳送到領地
        setall:
          Info:
          - '&e用法：&6/res setall [權限] [true/false/remove]'
          Description: 在所有的領地上設定通用權限
        resreload:
          Description: 重新載入領地插件
          Info:
          - '&e用法：&6/resreload'
        resload:
          Description: 載入領地存檔
          Info:
          - '&e用法：&6/resload'
          - '&e這個指令不安全，它不會先儲存領地狀態，'
          - '&e請確定變更完領地後再重新載入存檔'
        setallowner:
          Info:
          - '&e用法：&6/resadmin setallowner [舊擁有者] [新擁有者] (-keepflags)'
          Description: 將一名玩家名下的所有領地轉移給另一名玩家。
        restore:
          Info:
          - '&e用法：&6/res restore [領地名稱] [索引]'
          Description: 從藍圖還原領地
        save:
          Info:
          - '&e用法：&6/res save [領地名稱]'
          Description: 將領地儲存為藍圖
        pmirror:
          Info:
          - '&e用法：&6/res pmirror [領地名稱] [來源玩家] [目標玩家]'
          - 將某位玩家的權限鏡像套用到同一領地內的另一位玩家。
          Description: 鏡像複製玩家權限
        gui:
          Info:
          - '&e用法：&6/res gui [all|mine|pinned|manage|alias|desc|icon|toggle]'
          - 開啟領地清單與管理 GUI，支援跨服領地瀏覽、收藏、按讚與點擊傳送。
          Description: 開啟領地瀏覽與管理介面
        migrate:
          Info:
          - '&e用法：&6/resadmin migrate yaml2db apply'
          - '&e用法：&6/resadmin migrate db2yaml'
          - '&e用法：&6/resadmin migrate griefprevention [preview/apply] [ClaimData路徑]'
          - '&e用法：&6/resadmin migrate lands [preview/apply] [LandsData路徑]'
          - '&7（僅限主控台執行）'
          Description: 轉換 YAML/資料庫儲存或匯入 GriefPrevention／Lands 領地資料
        limit:
          Info:
          - '&e用法：&6/resadmin limit <玩家> info'
          - '&e用法：&6/resadmin limit <玩家> <add|remove|set> <res|x|y|z|size|subzones|rents> <數量>'
          - '&e用法：&6/resadmin limit <玩家> reset <res|x|y|z|size|subzones|rents|all>'
          Description: 管理個別玩家的跨服領地數量與尺寸上限
        auction:
          Info:
          - '&e用法：&6/res auction &7- 開啟領地拍賣場 GUI'
          - '&e用法：&6/res auction create [領地名稱] &7- 閱讀條款並發起拍賣'
          - '&e用法：&6/res auction bid <編號> <金額> &7- 喊價（含確認畫面）'
          - '&e用法：&6/res auction cancel <編號> &7- 取消無人喊價的拍賣'
          - '&e用法：&6/res auction setinc <編號> <金額> &7- 調整最低加價金額'
          - '&e用法：&6/res auction ack &7- 開啟拍賣通知中心'
          - '&e管理員：&6/resadmin auction start <領地> <起標價> [加價] [小時] [NONE|ITEMS_ONLY|ALL]'
          Description: 開啟領地拍賣介面或管理拍賣
        cleanup:
          Info:
          - '&e用法：&6/res cleanup import [all|plan|husksync] [dryrun] &7- 從 Plan／HuskSync 補齊缺少的上次上線時間（含保管原領主）'
          - '&e用法：&6/res cleanup setowner <領地> <玩家ID|UUID|clear> [顯示名稱] &7- 手動設定或清除 Server_Unclaimed 原領地主'
          - '&e用法：&6/res cleanup archive <領地> [玩家ID|UUID] [顯示名稱] &7- 一鍵將領地轉為暫管並設定原領地主'
          Description: 管理暫管領地原領地主與匯入外部最後上線紀錄
        neighbor:
          Info:
          - '&e用法：&6/res neighbor [領地名稱] <玩家|*> [true|false|remove]'
          - 授權指定好友（或 * 全體玩家）無視最小領地間隔限制，直接緊貼你的領地旁建立或擴展領地。
          Description: 授權他人在你的領地旁小於最小間距建立領地
        co:
          Info:
          - '&e用法：&6/res co l [u:<玩家>] [r:<半徑>] [t:<時間>] [a:<動作>] [res:<領地>] &7- 查詢領地歷史紀錄'
          - '&e用法：&6/res co rb <t:<時間>|#<編號>> [u:<玩家>] [r:<半徑>] [a:<動作>] [#preview] &7- 還原領地操作'
          - '&e用法：&6/res co rs <t:<時間>|#<編號>> [篩選條件...] [#preview] &7- 重做先前還原的操作'
          - '&e用法：&6/res co recover <t:<時間>> [r:<半徑>] [o:<原領主>] [#preview] &7- 一鍵恢復半徑內或指定時間被刪除的領地'
          - '&e用法：&6/res co i &7- 開關方塊點擊歷史檢查器（點擊地面即可查已刪領地）'
          Description: 類 CoreProtect 的領地操作紀錄查詢、還原與半徑恢復系統
